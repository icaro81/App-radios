name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Synchronize Version with GitHub Run Number
        run: |
          NEW_VERSION="1.0.${{ github.run_number }}"
          echo "Synchronizing version to $NEW_VERSION (build ${{ github.run_number }})"
          sed -i "s/export const APP_VERSION = .*/export const APP_VERSION = '$NEW_VERSION';/" src/version.ts
          sed -i "s/export const APP_BUILD_CODE = .*/export const APP_BUILD_CODE = ${{ github.run_number }};/" src/version.ts
          sed -i "s/\"versionName\": .*/\"versionName\": \"$NEW_VERSION\",/" public/version.json
          sed -i "s/\"versionCode\": .*/\"versionCode\": ${{ github.run_number }},/" public/version.json
          cat src/version.ts

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          cd android
          dos2unix gradlew 2>/dev/null || sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Restore Consistent Signing Keystore
        run: |
          if [ -f android/app/debug.keystore.base64 ]; then
            base64 -d android/app/debug.keystore.base64 > android/app/debug.keystore
            echo "Consistent signing keystore restored successfully."
          fi
          ls -lh android/app/debug.keystore || true

      - name: Build APK with Gradle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          APK_NAME="Galena-Digital-v1.0.${{ github.run_number }}.apk"
          LEGACY_NAME="Radio-Cristal-v1.0.${{ github.run_number }}.apk"
          LATEST_NAME="Galena-Digital.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/$APK_NAME"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/$LEGACY_NAME"
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/$LATEST_NAME"
          ls -lh "android/app/build/outputs/apk/debug/$APK_NAME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galena-Digital-v1.0.${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/Galena-Digital-v1.0.${{ github.run_number }}.apk
            android/app/build/outputs/apk/debug/Radio-Cristal-v1.0.${{ github.run_number }}.apk
            android/app/build/outputs/apk/debug/Galena-Digital.apk

      - name: Prepare Dynamic Release Notes
        id: release_notes
        run: |
          TAGLINE=$(node -e "try { console.log(require('./public/version.json').tagline || ''); } catch { console.log(''); }")
          NOTES=$(node -e "try { console.log(require('./public/version.json').notes || ''); } catch { console.log(''); }")
          {
            echo "body<<EOF"
            echo "### Galena Digital HD v1.0.${{ github.run_number }}"
            if [ -n "$TAGLINE" ]; then
              echo "**Reseña:** $TAGLINE"
              echo ""
            fi
            echo "#### Novedades y cambios:"
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              echo "- Mejoras continuas en reproducción de audio y soporte para TV Box."
            fi
            echo ""
            echo "---"
            echo "📱 **Instalación directa:** Descarga el APK adjunto para instalar directamente encima de tu versión actual sin desinstalar."
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Galena Digital HD v1.0.${{ github.run_number }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            android/app/build/outputs/apk/debug/Galena-Digital-v1.0.${{ github.run_number }}.apk
            android/app/build/outputs/apk/debug/Radio-Cristal-v1.0.${{ github.run_number }}.apk
            android/app/build/outputs/apk/debug/Galena-Digital.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
