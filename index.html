    <meta name="twitter:card" content="summary_large_image" />

  <body class="bg-[#050508] text-white antialiased selection:bg-white/20 selection:text-white min-h-screen overflow-x-hidden font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root">
      <div style="position:fixed;inset:0;background:#050508;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;user-select:none;">
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div style="width:110px;height:110px;border-radius:28px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(16,185,129,0.18);overflow:hidden;">
            <img src="/pwa-192x192.png" alt="Radio Cristal HD" style="width:88px;height:88px;object-fit:contain;" />
          </div>
          <div style="margin-top:20px;text-align:center;">
            <h1 style="margin:0;font-size:18px;font-weight:700;letter-spacing:0.06em;color:#ffffff;font-family:'Plus Jakarta Sans',sans-serif;">RADIO CRISTAL HD</h1>
            <p style="margin:6px 0 0;font-size:11px;color:#9ca3af;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:0.18em;text-transform:uppercase;">Cargando sintonías...</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
